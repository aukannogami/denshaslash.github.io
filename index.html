  <script>

   const GOOGLE_FORM_ID = "1FAIpQLScfAhUQ-rPs81Iq9OHdHvEl5a1OjuddAbE1Pan71ykXFF-lTQ";
   const LINK_ID = "entry.271726683";
   const WAWA_ID = "entry.567168986";
   const GOOGLE_SHEET_ID = "1gyOJakKbp_p39SVDPp8qU6MvtowQOB9qgAFKezDCPsw";
   const DISPLAY_IMAGES = true;
   const IMAGE_APPROVAL = true;
   /*
            
            DONT EDIT BELOW THIS POINT IF YOU DONT KNOW WHAT YOU ARE DOING.
            
   */
const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/" + GOOGLE_SHEET_ID + "/export?format=csv";
   const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/" + GOOGLE_FORM_ID + "/formResponse";
   let canvas = document.getElementById("drawboxcanvas");
   let context = canvas.getContext("2d");
   context.fillStyle = "white";
   context.fillRect(0, 0, canvas.width, canvas.height);

   function setCanvasSize() {
    // Save the old drawing
    const oldWidth = canvas.width;
    const oldHeight = canvas.height;
    // Create a temporary canvas to store the current drawing
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = oldWidth;
    tempCanvas.height = oldHeight;
    const tempCtx = tempCanvas.getContext("2d");
    tempCtx.drawImage(canvas, 0, 0);
    // Get new display size from CSS (use offsetWidth for responsive width)
    const displayWidth = canvas.offsetWidth;
    const displayHeight = displayWidth; // Square canvas
    // Set canvas internal pixel size to match display size
    canvas.width = displayWidth;
    canvas.height = displayHeight;
    // Optional: clear canvas and fill white background
    context.fillStyle = "white";
    context.fillRect(0, 0, canvas.width, canvas.height);
    // Redraw the saved image, scaled to new size
    context.drawImage(tempCanvas, 0, 0, oldWidth, oldHeight, 0, 0, canvas.width, canvas.height);
    // NOTE: Clear undo history since it no longer matches the new canvas size
    restore_array = [];
    start_index = -1;
   }
   let restore_array = [];
   let start_index = -1;
   let stroke_color = "black";
   let stroke_width = "2";
   let is_drawing = false;

   function change_color(element) {
    stroke_color = element.style.background;
   }

   function start(event) {
    is_drawing = true;
    context.beginPath();
    const {
     x,
     y
    } = getCanvasCoordinates(event);
    context.moveTo(x, y);
    event.preventDefault();
   }

   function draw(event) {
    if (!is_drawing) return;
    const {
     x,
     y
    } = getCanvasCoordinates(event);
    context.lineTo(x, y);
    context.strokeStyle = stroke_color;
    context.lineWidth = stroke_width;
    context.lineCap = "round";
    context.lineJoin = "round";
    context.stroke();
    event.preventDefault();
   }

   function stop(event) {
    if (!is_drawing) return;
    context.stroke();
    context.closePath();
    is_drawing = false;
    restore_array.push(context.getImageData(0, 0, canvas.width, canvas.height));
    start_index++;
    event.preventDefault();
   }

   function getCanvasCoordinates(event) {
    const rect = canvas.getBoundingClientRect();
    let x, y;
    if (event.touches && event.touches.length > 0) {
     // Touch event
     x = event.touches[0].clientX;
     y = event.touches[0].clientY;
    } else if (event.changedTouches && event.changedTouches.length > 0) {
     // Touchend fallback
     x = event.changedTouches[0].clientX;
     y = event.changedTouches[0].clientY;
    } else {
     // Mouse event
     x = event.clientX;
     y = event.clientY;
    }
    // Convert screen coords to canvas coords
    const canvasX = (x - rect.left) * (canvas.width / rect.width);
    const canvasY = (y - rect.top) * (canvas.height / rect.height);
    return {
     x: canvasX,
     y: canvasY
    };
   }
   canvas.addEventListener("touchstart", start, false);
   canvas.addEventListener("touchmove", draw, false);
   canvas.addEventListener("touchend", stop, false);
   canvas.addEventListener("mousedown", start, false);
   canvas.addEventListener("mousemove", draw, false);
   canvas.addEventListener("mouseup", stop, false);
   canvas.addEventListener("mouseout", stop, false);

   function Restore() {
    if (start_index <= 0) {
     Clear();
    } else {
     start_index--;
     restore_array.pop();
     context.putImageData(restore_array[start_index], 0, 0);
    }
   }

   function Clear() {
    context.fillStyle = "white";
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.fillRect(0, 0, canvas.width, canvas.height);
    restore_array = [];
    start_index = -1;
   }
   context.drawImage = function() {
    console.warn("noo >:(");
   };
   document.getElementById("submit").addEventListener("click", async function() {
    const submitButton = document.getElementById("submit");
    const statusText = document.getElementById("status");
    submitButton.disabled = true;
    statusText.textContent = "Uploading...";
    const imageData = canvas.toDataURL("image/png");
    const blob = await (await fetch(imageData)).blob();
    const formData = new FormData();
    formData.append("image", blob, "drawing.png");
    try {
     const response = await fetch("https://api.imgur.com/3/image", {
      method: "POST",
      headers: {
       Authorization: `Client-ID ${CLIENT_ID}`
      },
      body: formData,
     });
     const data = await response.json();
     if (!data.success) throw new Error("Imgur upload failed");
     const imageUrl = data.data.link;
     console.log("Uploaded image URL:", imageUrl);
     const googleFormData = new FormData();
     googleFormData.append(ENTRY_ID, imageUrl);
     await fetch(GOOGLE_FORM_URL, {
      method: "POST",
      body: googleFormData,
      mode: "no-cors",
     });
     statusText.textContent = "Upload successful!";
     alert("Thank you for submitting your art! ♥");
     location.reload();
    } catch (error) {
     console.error(error);
     statusText.textContent = "Error uploading image.";
     alert("Error uploading image or submitting to Google Form. 💔");
    } finally {
     submitButton.disabled = false;
    }
   });
   async function fetchImages() {
    if (!DISPLAY_IMAGES) {
     console.log("Image display is disabled.");
     return;
    }
    try {
     const response = await fetch(GOOGLE_SHEET_URL);
     const csvText = await response.text();
     const rows = csvText.split("\n").slice(1);
     const gallery = document.getElementById("gallery");
     gallery.innerHTML = "";
     rows.reverse().forEach((row) => {
      const columns = row.split(",");
      if (columns.length < 2) return;
      const timestamp = columns[0].trim();
      const imgUrl = columns[1].trim().replace(/"/g, "");
      if (imgUrl.startsWith("http")) {
       const div = document.createElement("div");
       div.classList.add("image-container");
       div.innerHTML = `
                    
									<img src="${imgUrl}" alt="drawing">
										<p>${timestamp}</p>
                `;
       gallery.appendChild(div);
      }
     });
    } catch (error) {
     console.error("Error fetching images:", error);
     document.getElementById("gallery").textContent = "Failed to load images.";
    }
   }
   fetchImages();
  </script>
